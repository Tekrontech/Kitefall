name: Core tests

# Runs the pure C# game-rule tests (Assets/Scripts/Core + Assets/Tests/EditMode)
# with plain .NET – no Unity licence needed – and builds the Cloud Code module.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Run Core tests
        run: dotnet test Tools/CoreTests --logger "console;verbosity=normal"
      - name: Build Cloud Code module (server economy)
        run: dotnet build Server/KitefallEconomy/KitefallEconomy.sln -c Release
